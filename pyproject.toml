[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "travel-agent-v2"
version = "0.10.1"
description = "TripFlow: multimodal, confirmation-gated itinerary management and conflict detection."
requires-python = ">=3.11"

dependencies = [
    "openai-agents",
    "openai",
    "requests",
    "httpx>=0.27",
    "pydantic>=2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
travel-agent = "main:main"


[project.optional-dependencies]
dev = [
    "pytest",
]
docs = [
    "Pillow>=10",
]


[tool.setuptools]
py-modules = [
    "agent",
    "main",
    "tools",
    "state",
    "transport_provider",
    "loyalty_retriever",
    "loyalty_scope",
    "loyalty_service",
    "decision_service",
    "agent_service",
    "api_models",
    "app",
    "observability",
    "settings",
    "logging_config",
    "rate_limit",
    "metrics",
    "turn_controller",
    "tripflow_models",
    "tripflow_conflicts",
    "tripflow_service",
    "tripflow_api",
    "tripflow_agent",
    "flight_provider",
    "location_catalog",
    "tripflow_imports",
]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

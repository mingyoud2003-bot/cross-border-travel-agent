[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "travel-agent-v2"
version = "0.5.0"
description = "AI travel agent for cross-border transport planning and loyalty benefits."
requires-python = ">=3.11"

dependencies = [
    "openai-agents",
    "openai",
    "requests",
    "pydantic>=2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
travel-agent = "main:main"


[project.optional-dependencies]
dev = [
    "pytest",
    "httpx>=0.27",
]
docs = [
    "Pillow>=10",
]


[tool.setuptools]
py-modules = [
    "agent",
    "main",
    "tools",
    "state",
    "transport_provider",
    "loyalty_retriever",
    "loyalty_scope",
    "loyalty_service",
    "decision_service",
    "agent_service",
    "api_models",
    "app",
    "observability",
    "settings",
    "logging_config",
    "rate_limit",
    "metrics",
]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

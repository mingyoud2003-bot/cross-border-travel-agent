services:
  - type: web
    name: cross-border-travel-agent
    runtime: docker
    plan: free
    region: singapore
    numInstances: 1
    autoDeployTrigger: checksPass
    healthCheckPath: /ready
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: AERODATABOX_RAPIDAPI_KEY
        sync: false
      - key: SESSION_DB_PATH
        value: /tmp/travel-agent.db
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"

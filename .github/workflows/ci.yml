name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Unit and API tests
        run: python -m pytest -q
      - name: Validate Eval dataset
        run: |
          python evals/run_agent_eval.py --validate-only
          python evals/run_tripflow_eval.py --validate-only
          python evals/run_travel_rules_eval.py --validate-only
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Validate browser JavaScript syntax
        run: node --check web/tripflow.js

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t travel-agent-v2:ci .
